<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Relatório Semanal Vulcano</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one working column. Project header + hours bank on top, weekly form below, report sheet as its own view. */
:root{
  --bg:#F5F2F3; --surface:#FFFFFF; --surface2:#EFE9EB; --fg:#211A1D; --muted:#6B5E63; --line:#DCD2D5;
  --accent:#800020; --btn:#800020; --btn-fg:#FFFFFF; --accent-soft:#F4E5E9;
  --ok:#23703F; --ok-bg:#DFF0E5; --warn:#8A5600; --warn-bg:#FAEBC9; --crit:#B3261E; --crit-bg:#F8DDDB;
  --f-display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161214; --surface:#1F191C; --surface2:#2A2226; --fg:#F2EAEC; --muted:#AB9CA1; --line:#3B3035;
  --accent:#E8728E; --btn:#A3153A; --btn-fg:#FFFFFF; --accent-soft:#33202A;
  --ok:#74D19B; --ok-bg:#1B2E23; --warn:#F2C14E; --warn-bg:#3A2E12; --crit:#FF8F86; --crit-bg:#41201E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161214; --surface:#1F191C; --surface2:#2A2226; --fg:#F2EAEC; --muted:#AB9CA1; --line:#3B3035;
  --accent:#E8728E; --btn:#A3153A; --btn-fg:#FFFFFF; --accent-soft:#33202A;
  --ok:#74D19B; --ok-bg:#1B2E23; --warn:#F2C14E; --warn-bg:#3A2E12; --crit:#FF8F86; --crit-bg:#41201E; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:960px;margin:0 auto;padding-block:20px 40px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.1}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-bottom:14px;border-bottom:2px solid var(--accent)}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 260px}
.brand img{width:48px;height:48px;flex:none}
.brand small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.brand h1{font-size:28px;font-weight:700;color:var(--accent);letter-spacing:.01em}
.picker{display:flex;gap:8px;align-items:center;flex:1 1 280px;min-width:0}
.picker select{flex:1;min-width:0}
nav.tabs{display:flex;gap:4px;margin:14px 0 18px;border-bottom:1px solid var(--line)}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 14px;cursor:pointer;color:var(--muted);font-weight:500;margin-bottom:-1px}
nav.tabs button[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}

/* controls */
.btn{background:var(--btn);color:var(--btn-fg);border:1px solid var(--btn);border-radius:6px;padding:9px 16px;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--accent);filter:none}
.btn.danger{background:transparent;color:var(--crit);border-color:var(--line)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:84px}
input:hover,select:hover,textarea:hover{border-color:var(--muted)}
label.f{display:flex;flex-direction:column;gap:4px;min-width:0}
label.f>span{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.03em}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
.card>h2,.sec-h{font-size:21px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--accent);margin-bottom:12px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec-h small{font:400 13px var(--f-body);text-transform:none;letter-spacing:0;color:var(--muted)}
.muted{color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:500}
.chip.plain{background:var(--surface2);color:var(--muted)}
.pill{display:inline-block;border-radius:999px;padding:2px 12px;font-weight:600;font-size:13px}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.crit{background:var(--crit-bg);color:var(--crit)} .pill.na{background:var(--surface2);color:var(--muted)}
.banner{border-radius:8px;padding:10px 14px;margin-bottom:14px;background:var(--warn-bg);color:var(--warn);font-size:14px}

/* project head */
.phead{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:16px}
.phead h2{font-size:34px;font-weight:700}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* hours bank */
.bank-nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
.num{border-left:3px solid var(--line);padding-left:12px}
.num b{display:block;font:500 28px/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.num span{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.num.main{border-left-color:var(--accent)}
.bars{display:grid;gap:10px}
.bar-row{display:grid;grid-template-columns:150px 1fr 56px;gap:10px;align-items:center;font-size:13px}
.track{height:12px;background:var(--surface2);border-radius:6px;overflow:hidden}
.fill{height:100%;border-radius:6px;background:var(--accent)}
.fill.ok{background:var(--ok)} .fill.warn{background:var(--warn)} .fill.crit{background:var(--crit)}
.bank-foot{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px;font-size:14px}

/* tables */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{font:600 12px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t td.r,table.t th.r{text-align:right}
table.t tr:last-child td{border-bottom:0}
.mini{display:inline-block;height:8px;border-radius:4px;background:var(--accent);vertical-align:middle;opacity:.85}
.next-list{margin:0;padding-left:18px} .next-list li{margin:4px 0}

/* form */
.hdr-week{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hdr-week .lbl{font:600 22px var(--f-display);min-width:150px;text-align:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{cursor:pointer}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg span{display:inline-block;padding:7px 14px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-weight:600;font-size:14px}
.seg input:checked+span{border-color:transparent}
.seg input[value="OK"]:checked+span{background:var(--ok-bg);color:var(--ok)}
.seg input[value="AT"]:checked+span{background:var(--warn-bg);color:var(--warn)}
.seg input[value="CR"]:checked+span{background:var(--crit-bg);color:var(--crit)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.prog{display:grid;grid-template-columns:1fr 90px;gap:12px;align-items:center}
.prog input[type=range]{padding:0;border:0;background:none;accent-color:var(--accent)}
.rows{display:grid;gap:8px}
.row,.rowh{display:grid;gap:8px;align-items:end}
.row.done,.rowh.done{grid-template-columns:minmax(0,1fr) 160px 84px 150px 34px}
.row.next,.rowh.next{grid-template-columns:minmax(0,1fr) 160px 84px 34px}
.rowh{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.03em}
.row .mob{display:none}
.x{background:none;border:1px solid var(--line);border-radius:6px;height:38px;width:34px;cursor:pointer;color:var(--muted);font-size:18px;line-height:1}
.x:hover{color:var(--crit);border-color:var(--crit)}
.addrow{margin-top:10px}
.subtotal{display:flex;justify-content:flex-end;gap:8px;align-items:baseline;margin-top:10px;font-size:14px}
.subtotal b{font:500 18px var(--f-mono)}
.sticky{position:sticky;bottom:0;z-index:5;background:var(--surface);border-top:2px solid var(--accent);
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sticky .in{max-width:960px;margin:0 auto;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.sticky .sum{display:flex;gap:18px;flex-wrap:wrap;align-items:center;font-size:14px}
.sticky .sum b{font:500 17px var(--f-mono)}
.hint{font-size:13px;color:var(--muted);margin:0 0 10px}
.err{color:var(--crit);font-size:14px;margin-top:8px}

/* report view */
.rbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.rbar .sp{flex:1}
.sheetwrap{overflow-x:auto;padding:2px}
#copybox{width:100%;min-height:200px;font:13px var(--f-mono);margin-top:10px}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.empty{text-align:center;padding:48px 16px}
.empty h2{font-size:28px;margin-bottom:8px}

@media (max-width:700px){
  .grid2{grid-template-columns:1fr}
  .bank-nums{grid-template-columns:1fr 1fr 1fr;gap:8px}
  .num b{font-size:20px}
  .bar-row{grid-template-columns:1fr 48px}
  .bar-row>span:first-child{grid-column:1/-1}
  .rowh{display:none}
  .row.done,.row.next{grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;padding:10px;position:relative;background:var(--bg)}
  .row .mob{display:block}
  .row>label:first-child{grid-column:1/-1}
  .x{position:absolute;top:6px;right:6px;height:30px;width:30px;border:0;background:none}
  .row.next>label:first-child,.row.done>label:first-child{padding-right:28px}
  .phead h2{font-size:28px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(n) ? n : 0; };
const fmt = n => (Math.round(n * 10) / 10).toLocaleString('pt-BR', { maximumFractionDigits: 1 });
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const monday = s => { const d = parse(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return iso(d); };
const dm = s => { const d = parse(s); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}`; };
const dmy = s => `${dm(s)}/${parse(s).getFullYear()}`;
const weekLabel = w => `${dm(w)} a ${dm(addDays(w, 6))}`;
const slug = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-zA-Z0-9]+/g, '_').replace(/^_|_$/g, '').slice(0, 40) || 'projeto';

/* ---------- armazenamento ---------- */
const LS = 'vulcano-relatorio-local-v1';
function localStore() {
  let data = null;
  try { data = JSON.parse(localStorage.getItem(LS) || 'null'); } catch (e) {}
  if (!data) { const ex = exampleData(); data = { projects: { [ex.id]: { meta: ex.meta, reports: ex.reports } } }; }
  const pl = new Set(), rl = new Set();
  const save = () => { try { localStorage.setItem(LS, JSON.stringify(data)); } catch (e) {} };
  const plist = () => Object.entries(data.projects).map(([id, p]) => ({ id, ...p.meta }));
  const rlist = pid => Object.entries(data.projects[pid]?.reports || {}).map(([id, r]) => ({ id, ...r }));
  const fire = () => { pl.forEach(f => f()); rl.forEach(f => f()); };
  return {
    kind: 'local',
    subProjects(cb) { const f = () => cb(plist()); pl.add(f); setTimeout(f, 0); return () => pl.delete(f); },
    subReports(pid, cb) { const f = () => cb(rlist(pid)); rl.add(f); setTimeout(f, 0); return () => rl.delete(f); },
    async saveProject(id, d) { const cur = data.projects[id] || { reports: {} }; data.projects[id] = { meta: d, reports: cur.reports }; save(); fire(); },
    async saveReport(pid, wk, d) { data.projects[pid].reports[wk] = d; save(); fire(); },
    async delReport(pid, wk) { delete data.projects[pid].reports[wk]; save(); fire(); },
    async delProject(pid) { delete data.projects[pid]; save(); fire(); },
  };
}
function dbStore(db) {
  const list = s => s.docs.map(d => ({ id: d.id, ...d.data() }));
  return {
    kind: 'db',
    subProjects: cb => db.collection('projects').onSnapshot(s => cb(list(s)), () => cb([])),
    subReports: (pid, cb) => db.collection(`projects/${pid}/reports`).onSnapshot(s => cb(list(s)), () => cb([])),
    saveProject: (id, d) => db.doc(`projects/${id}`).set(d),
    saveReport: (pid, wk, d) => db.doc(`projects/${pid}/reports/${wk}`).set(d),
    delReport: (pid, wk) => db.doc(`projects/${pid}/reports/${wk}`).delete(),
    async delProject(pid, wks) { for (const w of wks) await db.doc(`projects/${pid}/reports/${w}`).delete(); await db.doc(`projects/${pid}`).delete(); },
  };
}

/* ---------- estado ---------- */
const S = { store: null, view: 'dash', projects: null, pid: null, reports: null, unsubR: null, draft: null, cur: null, canWrite: true, confirm: '' };
const project = () => (S.projects || []).find(p => p.id === S.pid) || null;
const hoursOf = r => (r.done || []).reduce((a, x) => a + num(x.h), 0);
const plannedOf = r => (r.next || []).reduce((a, x) => a + num(x.h), 0);
const sortReports = l => l.slice().sort((a, b) => a.weekStart < b.weekStart ? -1 : 1);
const withReport = (list, r) => sortReports(list.filter(x => x.weekStart !== r.weekStart).concat([r]));

function bank(p, reports, upTo) {
  const rs = reports.filter(r => !upTo || r.weekStart <= upTo);
  const used = rs.reduce((a, r) => a + hoursOf(r), 0);
  const budget = num(p.budgetHours);
  const progress = rs.length ? num(rs[rs.length - 1].progress) : 0;
  const pct = budget ? used / budget * 100 : null;
  const dev = pct == null ? null : pct - progress;
  const level = pct == null ? 'na' : (used > budget ? 'crit' : dev <= 5 ? 'ok' : dev <= 15 ? 'warn' : 'crit');
  return { used, budget, saldo: budget - used, pct, progress, dev, level };
}
const devText = b => b.pct == null ? '' :
  `${b.dev > 0 ? '+' : ''}${fmt(b.dev)} p.p.: ${fmt(b.pct)}% das horas consumidas para ${fmt(b.progress)}% do projeto concluído.`;

/* ---------- navegação ---------- */
function go(view, week) { if (view === 'form' && S.view === 'form' && !week) return; S.view = view; S.confirm = ''; if (view === 'form') openDraft(week || S.draft?.weekStart || monday(iso(new Date()))); render(); window.scrollTo(0, 0); }
function selectProject(pid) {
  S.pid = pid; S.reports = null; S.draft = null; S.cur = null;
  try { localStorage.setItem('vulcano-last-project', pid || ''); } catch (e) {}
  if (S.unsubR) { S.unsubR(); S.unsubR = null; }
  if (pid) S.unsubR = S.store.subReports(pid, l => { S.reports = sortReports(l); onData(); });
  render();
}
function onData() {
  if (S.view === 'form' && S.draft) { renderTop(); updateTotals(); return; }
  render();
}

/* ---------- topo ---------- */
function renderTop() {
  const sel = $('#projSel');
  const ps = (S.projects || []).slice().sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  sel.innerHTML = ps.length ? ps.map(p => `<option value="${esc(p.id)}"${p.id === S.pid ? ' selected' : ''}>${esc(p.name)}</option>`).join('') : '<option>Nenhum projeto</option>';
  sel.disabled = !ps.length;
  $('#newProj').disabled = !S.canWrite;
  document.querySelectorAll('#tabs button').forEach(b => {
    const on = b.dataset.go === S.view || (S.view === 'report' && b.dataset.go === 'form');
    on ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current');
    b.disabled = !project();
  });
  $('#tabs').hidden = S.view === 'proj';
  const msgs = [];
  if (S.store?.kind === 'local') msgs.push('Os dados ficam só neste navegador. Para compartilhar com a equipe, abra a página logado na sua conta.');
  if (!S.canWrite) msgs.push('Seu acesso é somente leitura: você pode ver os relatórios, mas não salvar.');
  $('#banner').innerHTML = msgs.map(m => `<div class="banner">${esc(m)}</div>`).join('');
}

/* ---------- views ---------- */
function render() {
  renderTop();
  const app = $('#app');
  if (S.projects == null) { app.innerHTML = '<p class="muted">Carregando…</p>'; return; }
  if (S.view === 'proj') { app.innerHTML = projFormHTML(); return; }
  if (!project()) { app.innerHTML = emptyHTML(); return; }
  if (S.reports == null) { app.innerHTML = '<p class="muted">Carregando relatórios…</p>'; return; }
  if (S.view === 'dash') app.innerHTML = dashHTML();
  else if (S.view === 'form') { if (!S.draft) openDraft(monday(iso(new Date()))); app.innerHTML = formHTML(); updateTotals(); }
  else if (S.view === 'report') app.innerHTML = reportViewHTML();
}

/* ----- formulário ----- */
function blankRow(kind) { return kind === 'done' ? { t: '', who: '', h: '', st: 'ok' } : { t: '', who: '', h: '' }; }
function openDraft(week) {
  const rs = S.reports || [];
  const ex = rs.find(r => r.weekStart === week);
  const prev = rs.filter(r => r.weekStart < week).pop();
  if (ex) S.draft = { weekStart: week, existing: true, prefilled: false, progress: num(ex.progress), status: ex.status || 'OK', notes: ex.notes || '',
    done: (ex.done || []).map(x => ({ ...x })), next: (ex.next || []).map(x => ({ ...x })) };
  else {
    const pre = prev && (prev.next || []).length ? prev.next.map(x => ({ t: x.t, who: x.who || '', h: '', st: 'and' })) : [];
    S.draft = { weekStart: week, existing: false, prefilled: pre.length > 0, progress: prev ? num(prev.progress) : 0, status: 'OK', notes: '',
      done: pre.length ? pre : [blankRow('done')], next: [blankRow('next')] };
  }
  S.msg = '';
}

  return `<div class="row ${kind}">${t}${who}${h}${st}<button type="button" class="x" data-act="rm" data-l="${kind}" data-i="${i}" aria-label="Remover linha">×</button></div>`;

  L.push(`Semana ${weekLabel(r.weekStart)} · Situação: ${r.status || '–'} (${SIT[r.status] || '–'})`);
  if (p.manager) L.push(`Gerente: ${p.manager}`);
  L.push(`Projeto concluído: ${fmt(num(r.progress))}%`);
  L.push('', `*Feito na semana (${fmt(hoursOf(r))} h)*`);
  (r.done || []).forEach(x => L.push(`• ${x.t}${x.who ? ' – ' + x.who : ''} – ${fmt(num(x.h))} h [${ST[x.st] || ''}]`));
  L.push('', `*Próxima semana (${fmt(plannedOf(r))} h previstas)*`);
  if ((r.next || []).length) r.next.forEach(x => L.push(`• ${x.t}${x.who ? ' – ' + x.who : ''}${num(x.h) ? ' – ' + fmt(num(x.h)) + ' h' : ''}`)); else L.push('• Nenhuma planejada');
  L.push('', '*Banco de horas*');
  if (b.budget) {
    L.push(`Orçadas: ${fmt(b.budget)} h · Usadas: ${fmt(b.used)} h (${fmt(b.pct)}%) · Saldo: ${fmt(b.saldo)} h`);
    L.push(`Semáforo: ${LV[b.level][0]} – ${devText(b)}`);
  } else L.push(`Usadas até agora: ${fmt(b.used)} h (horas orçadas não definidas)`);
  if (r.notes) L.push('', '*Impedimentos e riscos*', r.notes);
  return L.join('\n');
}

function reportViewHTML() {
  const p = project(), c = S.cur;
  if (!c) return '<p class="muted">Relatório não encontrado.</p>';
  const all = withReport(S.reports || [], c.report);
  return `
  <div class="rbar">
    <button class="btn ghost sm" data-act="back">← Voltar ao projeto</button><span class="sp"></span>
    ${c.unsaved ? '<span class="pill warn">Não salvo</span>' : '<span class="pill ok">Salvo</span>'}
    <button class="btn ghost sm" data-act="edit" ${S.canWrite ? '' : 'disabled'}>Editar</button>
    <button class="btn ghost sm" data-act="copy">Copiar texto</button>
    <button class="btn sm" data-act="dl" id="dlBtn">Baixar relatório</button>
    ${S.confirm === 'delrep' ? '<button class="btn danger sm" data-act="delrep2">Confirmar exclusão</button><button class="btn ghost sm" data-act="cancel">Cancelar</button>' : `<button class="btn danger sm" data-act="delrep" ${S.canWrite && !c.unsaved ? '' : 'disabled'}>Excluir</button>`}
  </div>
  <div class="sheetwrap">${paperHTML(p, c.report, all)}</div>
  <div id="copyfb"></div>`;
}

/* ----- projeto (cadastro) ----- */
function projFormHTML() {
  const e = S.editProj, p = e ? (S.projects || []).find(x => x.id === e) : null;
  return `<section class="card"><h2>${p ? 'Editar projeto' : 'Novo projeto'}</h2>
  <div class="grid2">
    <label class="f"><span>Nome do projeto</span><input id="pf-name" value="${esc(p?.name || '')}" placeholder="Ex.: Ensaio de tração – lote 12"></label>
    <label class="f"><span>Cliente</span><input id="pf-client" value="${esc(p?.client || '')}"></label>
    <label class="f"><span>Tipo de projeto</span><select id="pf-type">${TYPES.map(t => `<option${p?.type === t ? ' selected' : ''}>${t}</option>`).join('')}</select></label>
    <label class="f"><span>Gerente do projeto</span><input id="pf-manager" value="${esc(p?.manager || '')}"></label>
    <label class="f"><span>Horas orçadas na precificação</span><input id="pf-budget" class="mono" type="number" inputmode="decimal" min="0" step="0.5" value="${esc(p?.budgetHours ?? '')}" placeholder="Ex.: 80"></label>
    <label class="f"><span>Término previsto</span><input id="pf-end" type="date" value="${esc(p?.endDate || '')}"></label>
  </div>
  <label class="f" style="margin-top:16px"><span>Integrantes (separe por vírgula)</span><input id="pf-members" value="${esc((p?.members || []).join(', '))}" placeholder="Ana, Bruno, Carla"></label>
  <div id="pf-err" class="err" role="alert"></div>
  <div class="actions" style="margin-top:18px">
    <button class="btn" data-act="saveproj">Salvar projeto</button>
    <button class="btn ghost" data-act="cancelproj">Cancelar</button>
    ${p ? (S.confirm === 'delproj' ? '<button class="btn danger" data-act="delproj2">Confirmar: excluir projeto e relatórios</button>' : '<button class="btn danger" data-act="delproj">Excluir projeto</button>') : ''}
  </div></section>`;
}

/* ---------- ações ---------- */
async function saveDraftAndShow() {
  const d = S.draft, p = project();
  const clean = (l, k) => l.filter(x => String(x.t).trim()).map(x => k === 'done'
    ? { t: x.t.trim(), who: (x.who || '').trim(), h: num(x.h), st: x.st || 'ok' }
    : { t: x.t.trim(), who: (x.who || '').trim(), h: num(x.h) });
  const done = clean(d.done, 'done'), next = clean(d.next, 'next');
  if (!done.length) { $('#formErr').textContent = 'Adicione ao menos uma atividade feita na semana, com a descrição preenchida.'; return; }
  const r = { weekStart: d.weekStart, progress: Math.min(100, Math.max(0, num(d.progress))), status: d.status, done, next, notes: (d.notes || '').trim(), updatedAt: Date.now() };
  let unsaved = false;
  try { await S.store.saveReport(p.id, d.weekStart, r); }
  catch (e) { unsaved = true; toast('Não foi possível salvar. O relatório foi gerado, mas fica só nesta tela.'); }
  S.cur = { report: r, unsaved };
  S.view = 'report'; S.draft = null; S.confirm = '';
  render(); window.scrollTo(0, 0);
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast('Texto copiado'); }
  catch (e) {
    $('#copyfb').innerHTML = '<p class="hint" style="margin-top:12px">Não foi possível copiar automaticamente. Selecione o texto abaixo e copie com Ctrl+C.</p><textarea id="copybox" readonly></textarea>';
    const ta = $('#copybox'); ta.value = text; ta.focus(); ta.select();
  }
}
async function download() {
  const p = project(), c = S.cur, all = withReport(S.reports || [], c.report);
  const html = `<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relatório ${esc(p.name)} – ${weekLabel(c.report.weekStart)}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>body{margin:0;padding:24px;background:#efe9eb}@media print{body{padding:0;background:#fff}.paper{border:0!important}}${PAPER_CSS}</style></head><body>${paperHTML(p, c.report, all)}</body></html>`;
  let dl = null; try { dl = await claude.use('downloads'); } catch (e) {}
  if (!dl) { toast('Download indisponível aqui. Use "Copiar texto".'); return; }
  try { await dl.save({ filename: `Relatorio_${slug(p.name)}_${c.report.weekStart}.html`, data: html }); toast('Arquivo salvo'); }
  catch (e) { if (e && e.code !== 'declined') toast('Não foi possível baixar. Use "Copiar texto".'); }
}

document.addEventListener('click', async ev => {
  const t = ev.target.closest('[data-act],[data-go]'); if (!t) return;
  if (t.dataset.go) { go(t.dataset.go); return; }
  const a = t.dataset.act, p = project();
  if (a === 'newproj') { S.editProj = null; S.view = 'proj'; S.confirm = ''; render(); }
  else if (a === 'editproj') { S.editProj = S.pid; S.view = 'proj'; S.confirm = ''; render(); }
  else if (a === 'cancelproj') { S.view = 'dash'; S.confirm = ''; render(); }
  else if (a === 'fill') { go('form', monday(iso(new Date()))); }
  else if (a === 'open') { const r = S.reports.find(x => x.weekStart === t.dataset.wk); if (r) { S.cur = { report: r, unsaved: false }; S.view = 'report'; render(); window.scrollTo(0, 0); } }
  else if (a === 'back') { S.view = 'dash'; S.confirm = ''; render(); }
  else if (a === 'edit') { openDraft(S.cur.report.weekStart); S.view = 'form'; render(); window.scrollTo(0, 0); }
  else if (a === 'copy') { const all = withReport(S.reports || [], S.cur.report); copyText(reportText(p, S.cur.report, all)); }
  else if (a === 'dl') { download(); }
  else if (a === 'delrep') { S.confirm = 'delrep'; render(); }
  else if (a === 'cancel') { S.confirm = ''; render(); }
  else if (a === 'delrep2') { try { await S.store.delReport(p.id, S.cur.report.weekStart); toast('Relatório excluído'); S.cur = null; S.view = 'dash'; S.confirm = ''; } catch (e) { toast('Não foi possível excluir.'); } render(); }
  else if (a === 'wk') { const cur = S.draft.weekStart; syncNotes(); openDraft(addDays(cur, num(t.dataset.n))); render(); }
  else if (a === 'add') { const l = t.dataset.l; S.draft[l].push(blankRow(l)); render(); const rows = document.querySelectorAll(`#rows-${l} .row`); rows[rows.length - 1]?.querySelector('input')?.focus(); }
  else if (a === 'rm') { const l = t.dataset.l; S.draft[l].splice(+t.dataset.i, 1); if (!S.draft[l].length) S.draft[l].push(blankRow(l)); render(); }
  else if (a === 'gen') { syncNotes(); saveDraftAndShow(); }
  else if (a === 'saveproj') { saveProject(); }
  else if (a === 'delproj') { S.confirm = 'delproj'; render(); }
  else if (a === 'delproj2') {
    const wks = (S.reports || []).map(r => r.weekStart);
    try { await S.store.delProject(p.id, wks); toast('Projeto excluído'); } catch (e) { toast('Não foi possível excluir.'); }
    S.confirm = ''; S.view = 'dash'; S.pid = null; if (S.unsubR) { S.unsubR(); S.unsubR = null; }
    const rest = (S.projects || []).filter(x => x.id !== p.id); selectProject(rest[0]?.id || null);
  }
});
function syncNotes() { const n = $('#notes'); if (n && S.draft) S.draft.notes = n.value; }

document.addEventListener('input', ev => {
  const e = ev.target, d = S.draft; if (!d) return;
  if (e.dataset.l) { d[e.dataset.l][+e.dataset.i][e.dataset.f] = e.value; updateTotals(); }
  else if (e.id === 'progR' || e.id === 'progN') { const v = Math.min(100, Math.max(0, num(e.value))); d.progress = v; $('#progR').value = v; if (e.id === 'progR') $('#progN').value = v; updateTotals(); }
  else if (e.id === 'notes') d.notes = e.value;
  else if (e.name === 'sit') { d.status = e.value; $('#sitHint').textContent = SIT[e.value]; }
});
$('#projSel').addEventListener('change', e => { S.view = 'dash'; selectProject(e.target.value); });
$('#newProj').addEventListener('click', () => { S.editProj = null; S.view = 'proj'; S.confirm = ''; render(); });

async function saveProject() {
  const v = id => $('#' + id).value.trim();
  if (!v('pf-name')) { $('#pf-err').textContent = 'Informe o nome do projeto.'; return; }
  const old = S.editProj ? S.projects.find(x => x.id === S.editProj) : null;
  const id = old ? old.id : 'p' + Date.now().toString(36);
  const data = { name: v('pf-name'), client: v('pf-client'), type: $('#pf-type').value, manager: v('pf-manager'),
    budgetHours: num($('#pf-budget').value), endDate: $('#pf-end').value || '',
    members: v('pf-members').split(',').map(s => s.trim()).filter(Boolean), createdAt: old?.createdAt || Date.now() };
  if (old?.example) data.example = true;
  try { await S.store.saveProject(id, data); } catch (e) { $('#pf-err').textContent = 'Não foi possível salvar o projeto. Verifique se você tem permissão de edição.'; return; }
  toast('Projeto salvo');
  S.view = 'dash'; S.confirm = '';
  if (id !== S.pid) selectProject(id); else render();
}

/* ---------- início ---------- */
async function init() {
  renderTop(); render();
  let db = null;
  try { if (window.claude?.use) db = await window.claude.use('db'); } catch (e) {}
  S.store = db ? dbStore(db) : localStore();
  if (db) { try { const u = await window.claude.use('user'); const c = u?.can ? await u.can('data.write') : null; if (c === false) S.canWrite = false; } catch (e) {} }
  let first = true;
  S.store.subProjects(list => {
    S.projects = list;
    if (first) {
      first = false;
      let last = ''; try { last = localStorage.getItem('vulcano-last-project') || ''; } catch (e) {}
      const sorted = list.slice().sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
      const pick = sorted.find(p => p.id === last) || sorted[0];
      selectProject(pick ? pick.id : null);
    } else if (S.pid && !list.some(p => p.id === S.pid) && S.view !== 'proj') {
      const rest = list.slice().sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0)); selectProject(rest[0]?.id || null);
    } else onData();
  });
}
init();
})();
</script>
